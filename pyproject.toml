[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "alcedo-python"
version = "0.1.0"
description = "A small DDD and SQLAlchemy unit-of-work foundation for FastAPI"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "sqlalchemy[asyncio]>=2.0.36",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.hatch.build.targets.wheel]
packages = ["src/alcedo"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
